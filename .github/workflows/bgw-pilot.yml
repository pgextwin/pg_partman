name: Optional BGW Windows technical pilot
on:
  pull_request:
    paths:
      - 'pilot/bgw/**'
      - '.github/workflows/bgw-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bgw:
    name: PostgreSQL ${{ matrix.major }} BGW technical pilot
    runs-on: windows-latest
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        include:
          - {major: 14, chocolateyPackage: postgresql14, chocolateyVersion: '14.24.0'}
          - {major: 15, chocolateyPackage: postgresql15, chocolateyVersion: '15.19.0'}
          - {major: 16, chocolateyPackage: postgresql16, chocolateyVersion: '16.15.5'}
          - {major: 17, chocolateyPackage: postgresql17, chocolateyVersion: '17.11.4'}
          - {major: 18, chocolateyPackage: postgresql18, chocolateyVersion: '18.6.5'}
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out pinned upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pgpartman/pg_partman
          ref: f7e83b9c441c7e97066d815bbe14e02a9dc5ff94
          path: upstream
      - name: Check out common install scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pgextwin/build
          ref: 43993b864e59bd35870e15c410ac13c85def8531
          path: .pgextwin-build
      - name: Install PostgreSQL ${{ matrix.major }}
        shell: pwsh
        run: |
          & '.pgextwin-build/scripts/install-postgresql.ps1' -Major ([int]"${{ matrix.major }}") -ChocolateyPackage "${{ matrix.chocolateyPackage }}" -ChocolateyVersion "${{ matrix.chocolateyVersion }}" -TestPort 55432
      - name: Assemble and install SQL package
        shell: pwsh
        run: |
          & './windows/ci/build.ps1' -PgRoot $env:PGROOT -UpstreamDir (Join-Path $PWD 'upstream')
          & './windows/ci/install.ps1' -PgRoot $env:PGROOT -UpstreamDir (Join-Path $PWD 'upstream')
      - name: Build optional BGW DLL with MSVC
        shell: pwsh
        run: |
          & './pilot/bgw/build.ps1' -PgRoot $env:PGROOT -UpstreamDir (Join-Path $PWD 'upstream')
      - name: Start and exercise the BGW in isolated PostgreSQL
        shell: pwsh
        run: |
          & './pilot/bgw/smoke-test.ps1' -PgRoot $env:PGROOT -PgPort ([int]$env:PGPORT) -PostgreSqlMajor ([int]"${{ matrix.major }}")
